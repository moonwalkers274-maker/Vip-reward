name: Build Invite Rewards APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Arrange Android project
        run: |
          mkdir -p app/src/main/java/com/deepanshu/invitedemo
          mkdir -p app/src/main/res/values

          mv MainActivity.java app/src/main/java/com/deepanshu/invitedemo/MainActivity.java
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv colors.xml app/src/main/res/values/colors.xml
          mv themes.xml app/src/main/res/values/themes.xml
          mv build.gradle app/build.gradle

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Vip-reward"
          include ':app'
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepanshuInviteRewards
          path: app/build/outputs/apk/debug/app-debug.apk
